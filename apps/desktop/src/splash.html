<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' file:" />
    <title>Grom AI Studio</title>
    <style>
      /* Shown before the web app (and its design tokens) exists; the values mirror packages/ui tokens.css (dark). */
      :root {
        --bg-0: #080808;
        --bg-2: #111111;
        --border: rgb(255 255 255 / 0.08);
        --text-1: #fafafa;
        --text-2: #a8a8a8;
        --text-3: #757575;
        --brand: #fe4541;
        --accent: #e11d48;
        --accent-rgb: 225 29 72;
        --accent-2: #e5b84e;
        --accent-2-rgb: 229 184 78;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg-0);
        color: var(--text-1);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        user-select: none;
      }
      /* The stage: the mark and everything it throws off are drawn here, behind the text */
      #strike {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      main {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(620px, 88vw);
        text-align: center;
      }
      /* Where the mark sits. The room under it is for the ring that turns around it. */
      #mark {
        width: min(300px, 44vw);
        aspect-ratio: 831 / 459;
        margin: 60px 0 96px;
      }
      #wordmark {
        color: var(--text-2);
        font-size: 13px;
        letter-spacing: 0.42em;
        text-indent: 0.42em; /* the trailing letter-space would pull it off centre */
        text-transform: uppercase;
        opacity: 0;
      }
      #wordmark b {
        color: var(--text-1);
        font-weight: 700;
      }
      h1 {
        min-height: 27px;
        margin: 26px 0 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      #detail {
        min-height: 20px;
        max-width: 100%;
        margin-top: 6px;
        overflow: hidden;
        color: var(--text-3);
        font: 12px/1.6 ui-monospace, 'Cascadia Mono', Menlo, monospace;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* A comet of light running along a track */
      .beam {
        position: relative;
        width: 220px;
        height: 2px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.07);
      }
      .beam::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--accent) 55%, var(--accent-2));
        box-shadow: 0 0 12px rgb(var(--accent-rgb) / 0.9);
        animation: run 1.25s cubic-bezier(0.6, 0, 0.3, 1) infinite;
      }
      .failed .beam,
      #error {
        display: none;
      }
      .failed #error {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin-top: 18px;
      }
      .failed h1 {
        color: #f87171;
      }
      .failed #mark {
        margin: 0 0 40px;
      }
      pre {
        max-height: 190px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg-2);
        color: var(--text-2);
        font: 11.5px/1.5 ui-monospace, 'Cascadia Mono', Menlo, monospace;
        text-align: left;
        white-space: pre-wrap;
        user-select: text;
      }
      .actions {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      button {
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--bg-2);
        color: var(--text-1);
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        border-color: transparent;
        background: var(--accent);
      }
      @keyframes run {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(245%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .beam::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="strike" aria-hidden="true"></canvas>
    <main id="root">
      <div id="mark"></div>
      <div id="wordmark"><b>Grom</b> AI Studio</div>
      <h1 id="title">Starting Grom AI Studio</h1>
      <div id="detail"></div>
      <div class="beam"></div>
      <div id="error">
        <pre id="log"></pre>
        <div class="actions">
          <button class="primary" id="retry">Try again</button>
          <button id="logs">Open the log folder</button>
          <button id="quit">Quit</button>
        </div>
      </div>
    </main>
    <script src="logo-parts.js"></script>
    <script src="strike.js"></script>
    <script>
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      const root = document.getElementById('root')
      const title = document.getElementById('title')
      const detail = document.getElementById('detail')

      /* ----------------------------- the mark ----------------------------- */
      // The same loading sequence as the web app's loader (strike.js): the mark builds itself out of its pieces
      // and then hunts, is cut, darts and shatters until the app is up.
      const mark = document.getElementById('mark')
      const stage = document.getElementById('strike')
      // Where the mark is drawn: over its box in the layout, until it leaves for the home page's (see leave)
      let place = null
      const inLayout = () => {
        const box = mark.getBoundingClientRect()
        return { x: box.left + box.width / 2, y: box.top + box.height / 2, size: box.width }
      }
      const strike = window.createStrike(stage, {
        logo: window.LOGO,
        size: () => (place ?? inLayout()).size,
        center: () => place ?? inLayout(),
        onRound: () => {
          played = true
          if (ready) strike.finish(leave)
        },
      })
      const wordmark = document.getElementById('wordmark')
      if (calm) wordmark.style.opacity = 1
      // The name arrives as the last piece lands
      else wordmark.animate([{ opacity: 0, letterSpacing: '0.9em' }, { opacity: 1, letterSpacing: '0.42em' }], { duration: 1000, delay: 780, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'both' })

      /* ---------------------------- the way out ---------------------------- */
      // This page lies over the app, which loads underneath. When the app is up (and, on a launch, the sequence has
      // played through once), the text goes and the mark makes for the home page's own mark: it lands there with
      // a blow that tears this page open, and the app is what is behind the tear.
      let played = calm
      let ready = null
      window.desktop.onReady((info) => {
        ready = info
        if (played || !info.wait) strike.finish(leave)
      })

      const fadeOut = (node, duration) => node.animate([{ opacity: 1 }, { opacity: 0 }], { duration, fill: 'forwards', easing: 'ease' }).finished

      function leave() {
        const here = inLayout()
        const spot = ready.target
        place = here // the text's box is about to go; the mark stays where it is until it leaves
        void fadeOut(root, 220)
        document.body.style.background = 'transparent' // the canvas paints the ground from here on
        strike.exit({
          to: spot ? { x: spot.x + spot.width / 2, y: spot.y + spot.height / 2, size: spot.width } : here,
          ground: getComputedStyle(document.documentElement).getPropertyValue('--bg-0').trim(),
          onLand: () => window.desktop.landed(),
          // What is left is the mark, sitting on the home page's own: let that one take over
          onDone: () => void fadeOut(stage, 260).then(() => window.desktop.done()),
        })
      }

      /* --------------------------- status text ---------------------------- */
      // New text decodes itself: characters flicker through glyphs and lock in from left to right
      const GLYPHS = '01<>/\\|[]{}#%&*+=-_:;!?ABCDEFGHJKLMNPQRSTUVWXYZ'
      const running = new WeakMap()
      function decode(node, text, duration = 520) {
        cancelAnimationFrame(running.get(node))
        if (calm || !text) return void (node.textContent = text)
        const started = performance.now()
        const frame = (now) => {
          const settled = ((now - started) / duration) * text.length
          let shown = ''
          for (let i = 0; i < text.length; i++) shown += i < settled || text[i] === ' ' ? text[i] : GLYPHS[Math.floor(Math.random() * GLYPHS.length)]
          node.textContent = shown
          if (settled < text.length) running.set(node, requestAnimationFrame(frame))
        }
        running.set(node, requestAnimationFrame(frame))
      }
      decode(title, title.textContent, 800)

      window.desktop.onStatus((status) => {
        if (root.classList.contains('failed')) {
          root.classList.remove('failed')
          strike.rest(false)
        }
        if (status.title !== undefined && status.title !== title.textContent) decode(title, status.title)
        if (status.detail !== undefined) detail.textContent = status.detail
      })
      window.desktop.onError((error) => {
        root.classList.add('failed')
        strike.rest(true)
        decode(title, "Grom AI Studio couldn't start")
        detail.textContent = error.message
        document.getElementById('log').textContent = error.log || error.logFile
      })
      document.getElementById('retry').addEventListener('click', () => window.desktop.retry())
      document.getElementById('logs').addEventListener('click', () => window.desktop.openLogs())
      document.getElementById('quit').addEventListener('click', () => window.desktop.quit())
    </script>
  </body>
</html>
